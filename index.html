<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0d1130" />
    <meta name="description" content="A private page." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1130'/%3E%3Ccircle cx='12' cy='17' r='3.2' fill='%23ffe2b0'/%3E%3Ccircle cx='21' cy='14' r='2.6' fill='%23f6f0ff'/%3E%3C/svg%3E" />
    <title>Our Universe</title>
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <canvas id="sky" aria-hidden="true"></canvas>

    <button class="sound" id="sound" type="button" aria-pressed="false">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="sound-label">Sound off</span>
    </button>

    <section class="gate" id="gate" aria-labelledby="gate-title">
      <div class="gate-inner">
        <div class="lone-star" aria-hidden="true"></div>
        <h1 id="gate-title"></h1>
        <p class="line"></p>
        <form id="gate-form" autocomplete="off" novalidate>
          <label for="pass"></label>
          <input id="pass" name="pass" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="dd/mm/yyyy" aria-describedby="pass-hint pass-msg" />
          <p class="hint" id="pass-hint"></p>
          <button type="submit"></button>
          <p class="msg" id="pass-msg" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <main id="story" aria-label="Our story" hidden></main>

    <noscript><p style="position:fixed;inset:auto 0 2rem;text-align:center;color:#fff4dc;z-index:99">This page needs JavaScript turned on.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
